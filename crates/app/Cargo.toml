[package]
name = "emissor-nfse"
version = "1.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono = "0.4.45"
nfse-cert = { version = "0.1.0", path = "../nfse-cert" }
nfse-core = { version = "0.1.0", path = "../nfse-core" }
nfse-db = { version = "0.1.0", path = "../nfse-db" }
nfse-emissor = { version = "0.1.0", path = "../nfse-emissor" }
nfse-pdf = { version = "0.1.0", path = "../nfse-pdf" }
nfse-xml = { version = "0.1.0", path = "../nfse-xml" }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-updater = "2.12.0"
# No Linux, o seletor pelo xdg-desktop-portal: abre o diálogo do ambiente (KDE, GNOME), não o do GTK.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-window-state = "2.4.1"
tokio = { version = "1.53.3", features = ["sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std", "ansi"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
