[package]
name = "nfse-db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
chrono = "0.4.45"
hex = "0.4.3"
nfse-cert = { version = "0.1.0", path = "../nfse-cert" }
nfse-core = { version = "0.1.0", path = "../nfse-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
zeroize = "1.9.1"
