[package]
name = "nfse-cert"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono = "0.4.45"
der = "0.7"
hex = "0.4.3"
nfse-core = { version = "0.1.0", path = "../nfse-core" }
p12-keystore = "0.4.1"
rsa = { version = "0.9", features = ["sha1"] }
sha1 = "0.10"
thiserror = "2.0.21"
x509-cert = { version = "0.2", features = ["std"] }
zeroize = "1.9.1"
