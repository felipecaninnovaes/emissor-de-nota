[package]
name = "nfse-poc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
nfse-cert = { version = "0.1.0", path = "../nfse-cert" }
nfse-core = { version = "0.1.0", path = "../nfse-core" }
nfse-emissor = { version = "0.1.0", path = "../nfse-emissor" }
nfse-nacional = { version = "0.1.0", path = "../nfse-nacional" }
nfse-pdf = { version = "0.1.0", path = "../nfse-pdf" }
nfse-xml = { version = "0.1.0", path = "../nfse-xml" }
roxmltree = "0.21.1"
rpassword = "7.5.4"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
zeroize = "1.9.1"
