[package]
name = "nfse-emissor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
calamine = { version = "0.35", features = ["dates"] }
chrono = "0.4.45"
csv = "1.4"
encoding_rs = "0.8"
nfse-cert = { version = "0.1.0", path = "../nfse-cert" }
nfse-core = { version = "0.1.0", path = "../nfse-core" }
nfse-db = { version = "0.1.0", path = "../nfse-db" }
nfse-nacional = { version = "0.1.0", path = "../nfse-nacional" }
nfse-pdf = { version = "0.1.0", path = "../nfse-pdf" }
nfse-xml = { version = "0.1.0", path = "../nfse-xml" }
thiserror = "2.0.21"

[dev-dependencies]
nfse-db = { path = "../nfse-db", features = ["teste"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
zip = { version = "7", default-features = false }
