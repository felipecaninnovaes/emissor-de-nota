# Configuração do cargo-deny (`cargo deny check licenses`).
# Só licenças compatíveis com a AGPL-3.0 do projeto (ADR 0016).

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "AGPL-3.0-only",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
