[workspace]
resolver = "3"
members = ["crates/*"]
# Pasta de cache criada por ferramentas de desenvolvimento; não é um crate.
exclude = ["crates/graft"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.88"

# Sem debug info completo: o target/ de desenvolvimento chegava a 30 GB e lotava o disco.
# Os backtraces continuam com arquivo e linha do nosso código.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
