[package]
name = "emissor-nuvem"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.88"
publish = false
description = "Servidor do backup na nuvem do Emissor NFS-e: painel do administrador e API do aplicativo"

# Projeto separado do aplicativo: não entra no build nem no CI do Windows (ADR 0017).
[workspace]

[dependencies]
argon2 = "0.5"
askama = "0.16"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rusty-s3 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
