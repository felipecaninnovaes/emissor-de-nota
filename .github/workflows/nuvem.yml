name: Imagem do backup na nuvem

# Publica a imagem do painel (servidor/, ADR 0017) em ghcr.io/felipecaninnovaes/emissor-nuvem.
# - Push na main que mexe em servidor/: tags `latest` e `sha-<commit>`.
# - Tag `nuvem-vX.Y.Z` (igual à version de servidor/Cargo.toml): tag `X.Y.Z`, que o compose fixa com VERSAO_PAINEL.
on:
  push:
    branches: [main]
    paths: ["servidor/**", ".github/workflows/nuvem.yml"]
    tags: ["nuvem-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    name: Build e publicação (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/nuvem-v')
        run: |
          versao=$(grep -m1 '^version' servidor/Cargo.toml | cut -d'"' -f2)
          if [ "nuvem-v$versao" != "${GITHUB_REF_NAME}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não bate com a versão $versao de servidor/Cargo.toml" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/emissor-nuvem
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=match,pattern=nuvem-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: servidor
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
