name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Semanal: alertas novos de vulnerabilidade aparecem sem mudança no código.
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (fmt, clippy, testes)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  xmlsec1:
    name: XSD oficial (xmllint) e assinatura (xmlsec1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.20.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: devbox run -- cargo test -p nfse-xml --locked -- --include-ignored

  licencas:
    name: Licenças e vulnerabilidades das dependências (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses

  servidor:
    name: Servidor do backup na nuvem (fmt, clippy, testes com Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nuvem
          POSTGRES_PASSWORD: nuvem
          POSTGRES_DB: nuvem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nuvem" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://nuvem:nuvem@localhost:5432/nuvem
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: servidor
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked -- --include-ignored

  licencas-servidor:
    name: Licenças e vulnerabilidades das dependências do servidor (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # O deny.toml fica na raiz; o --config vai antes do `check`.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - run: cargo deny --manifest-path servidor/Cargo.toml --config deny.toml check advisories licenses
