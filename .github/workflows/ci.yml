name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (fmt, clippy, testes)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  xmlsec1:
    name: XSD oficial (xmllint) e assinatura (xmlsec1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.19.0
      - uses: Swatinem/rust-cache@v2
      - run: devbox run -- cargo test -p nfse-xml --locked -- --include-ignored

  licencas:
    name: Licenças das dependências (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  servidor:
    name: Servidor do backup na nuvem (fmt, clippy, testes com Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nuvem
          POSTGRES_PASSWORD: nuvem
          POSTGRES_DB: nuvem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nuvem" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://nuvem:nuvem@localhost:5432/nuvem
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: servidor
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked -- --include-ignored

  licencas-servidor:
    name: Licenças das dependências do servidor (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O deny.toml fica na raiz; o --config vai antes do `check`.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --manifest-path servidor/Cargo.toml --config deny.toml check licenses
